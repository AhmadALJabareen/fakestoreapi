<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: #0a0711;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
        }

        main {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 300px;
            width: 100%;
            border: 1px solid #ccc;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        form input, form button {
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        form button {
            background: #333;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }

        form button:hover {
            background: #555;
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            text-align: center;
            max-width: 300px;
            width: 100%;
            background: #f9f9f9;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 8px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
        }

        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Header</h1>
    </header>
    <main>
        <form>
            <input type="text" placeholder="Enter Title Product" id="title">
            <input type="text" placeholder="Enter Price Product" id="price">
            <input type="text" placeholder="Enter Product Description" id="description">
            <input type="file" alt="Product Image" id="img">
            <button>Add</button>
        </form>
        <div class="container">
            <div class="card">
                <img src="" alt="">
                <h2></h2>
                <p></p>
            </div>
        </div>
        
    </main>
    <footer>
        <p>&copy; 2025 My Website</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
